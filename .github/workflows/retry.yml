name: retry-based
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q oci-cli
      - name: retry
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_CLI_REGION: sa-saopaulo-1
          ROOT: ${{ secrets.OCI_CLI_TENANCY }}
          SSHKEY: ${{ secrets.SSH_PUBKEY }}
          FIXSH: ${{ secrets.FIXSH_B64 }}
          WH: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set +e
          AD="NXhS:SA-SAOPAULO-1-AD-1"
          BV=ocid1.bootvolume.oc1.sa-saopaulo-1.abtxeljr7kmbf7qo3djtxdzbgzsntjv5isxkn5j255fgziql5cjtzz2framq
          SUBNET=ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaaoqimg5c6leh4hgdvrv65fp7xi6bxnudte2t5coax5sqjbw4uqlqq
          HD=ocid1.volume.oc1.sa-saopaulo-1.abtxeljrcme56jil6sejy2fep3lkde6mx24gqbwy5sbvo4s6lhk63lf2ikaa
          echo "$SSHKEY" > /tmp/key.pub
          EXISTS=$(oci compute instance list --compartment-id "$ROOT" --all --query 'data[?"shape"==`VM.Standard.A1.Flex` && "lifecycle-state"!=`TERMINATED`].id | [0]' --raw-output 2>/dev/null)
          if [ -n "$EXISTS" ]; then echo "ja existe: $EXISTS"; exit 0; fi
          for i in $(seq 1 8); do
            echo "[$(date +%H:%M:%S)] tentativa $i"
            OUT=$(oci compute instance launch --compartment-id "$ROOT" --availability-domain "$AD" \
              --shape VM.Standard.A1.Flex --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --display-name "based" --private-ip 10.0.0.144 \
              --source-details "{\"sourceType\":\"bootVolume\",\"bootVolumeId\":\"$BV\"}" \
              --subnet-id "$SUBNET" --ssh-authorized-keys-file /tmp/key.pub \
              --metadata "{\"user_data\":\"$FIXSH\"}" \
              --wait-for-state RUNNING --query 'data.id' --raw-output 2>&1)
            RC=$?
            if [ $RC -eq 0 ] && [ -n "$OUT" ]; then BASED2="$OUT"; echo "SUCESSO: $BASED2"; break; fi
            echo "falhou (rc=$RC): $(echo "$OUT" | grep -oE '\"(code|message)\": \"[^\"]*\"' | tr '\n' ' ')"
            sleep 90
          done
          if [ -z "$BASED2" ]; then echo "sem capacidade nesta rodada"; exit 0; fi
          sleep 60
          VNIC=$(oci compute vnic-attachment list --compartment-id "$ROOT" --instance-id "$BASED2" --query 'data[0]."vnic-id"' --raw-output)
          PID=$(oci network private-ip list --vnic-id "$VNIC" --query 'data[0].id' --raw-output)
          PUBIP=$(oci network public-ip list --compartment-id "$ROOT" --scope REGION --all --query 'data[?"display-name"==`based-ip`].id | [0]' --raw-output)
          oci network public-ip update --public-ip-id "$PUBIP" --private-ip-id "$PID" --query 'data."ip-address"' --raw-output
          oci compute volume-attachment attach --instance-id "$BASED2" --volume-id "$HD" --type paravirtualized --query 'data."lifecycle-state"' --raw-output
          curl -s --max-time 10 -o /dev/null -X POST -H "Content-Type: application/json" -d '{"content":"obtido instancia de volta"}' "$WH"
