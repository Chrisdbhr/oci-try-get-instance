name: retry-based
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q oci-cli
      - name: retry
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_CLI_REGION: sa-saopaulo-1
          ROOT: ${{ secrets.OCI_CLI_TENANCY }}
          SSHKEY: ${{ secrets.SSH_PUBKEY }}
          FIXSH: ${{ secrets.FIXSH_B64 }}
          WH: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set +e
          LOG=/tmp/retry.log
          : > "$LOG"
          log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"; echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*" >> "$LOG"; }
          # Try to read creds from ENV (AuthN/AuthZ via env vars set in step env)
          export OCI_CLI_USER="${OCI_CLI_USER:-}"
          export OCI_CLI_TENANCY="${OCI_CLI_TENANCY:-}"
          export OCI_CLI_FINGERPRINT="${OCI_CLI_FINGERPRINT:-}"
          export OCI_CLI_REGION="${OCI_CLI_REGION:-sa-saopaulo-1}"
          if [ -n "$OCI_CLI_KEY_CONTENT" ]; then
            echo "$OCI_CLI_KEY_CONTENT" > /tmp/oci_key.pem
            chmod 600 /tmp/oci_key.pem
            export OCI_CLI_KEY_FILE=/tmp/oci_key.pem
          fi
          FIX=$(echo "$FIXSH" | tr -d '\n\r')
          if echo "$FIX" | base64 -d > /tmp/fixcheck 2>/dev/null; then log "FIXSH: ok ($(wc -c </tmp/fixcheck) bytes)"; else log "FIXSH: INVALIDO"; fi
          AD="NXhS:SA-SAOPAULO-1-AD-1"
          IMAGE=ocid1.image.oc1.sa-saopaulo-1.aaaaaaaav4hskmch2ikmva5wxqilujiwjsug7htb6k2silemwuzxcbwwxklq
          SUBNET=ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaaoqimg5c6leh4hgdvrv65fp7xi6bxnudte2t5coax5sqjbw4uqlqq
          HD=ocid1.volume.oc1.sa-saopaulo-1.abtxeljrogyuzulcob7br75h7njpavrwwkrgvf53uzebjnuss7cxdy6deiea
          echo "$SSHKEY" > /tmp/key.pub

          # Verificar se ja existe instancia A1
          EXISTS=$(oci compute instance list --compartment-id "$ROOT" --all --query 'data[?"shape"==`VM.Standard.A1.Flex` && "lifecycle-state"!=`TERMINATED`].id | [0]' --raw-output 2>/dev/null)
          if [ -n "$EXISTS" ]; then log "ja existe instancia A1: $EXISTS"; exit 0; fi
          log "nenhuma instancia A1 ativa - iniciando retry"

          # Pre-flight: verificar quota A1 (verboso)
          log "=== PRE-FLIGHT: verificando quota A1 ==="
          CORES_OK=false
          PRELOG=""
          for attempt in $(seq 1 5); do
            CORE_RAW=$(oci limits resource-availability get --compartment-id "$ROOT" --service-name compute --limit-name standard-a1-core-count --availability-domain "$AD" 2>&1)
            MEM_RAW=$(oci limits resource-availability get --compartment-id "$ROOT" --service-name compute --limit-name standard-a1-memory-count --availability-domain "$AD" 2>&1)
            CORE_AVAIL=$(echo "$CORE_RAW" | grep -oP '"available": \K[0-9]+' | head -1)
            MEM_AVAIL=$(echo "$MEM_RAW" | grep -oP '"available": \K[0-9]+' | head -1)
            PRELOG="${PRELOG}\n  preflight#$attempt cores_avail=${CORE_AVAIL:-?} mem_avail=${MEM_AVAIL:-?} (used: $(echo "$CORE_RAW"|grep -oP '"used": \K[0-9]+'|head -1)/$(echo "$MEM_RAW"|grep -oP '"used": \K[0-9]+'|head -1))"
            if [ "${CORE_AVAIL:-0}" -ge 2 ] 2>/dev/null && [ "${MEM_AVAIL:-0}" -ge 12 ] 2>/dev/null; then
              CORES_OK=true
              log "  preflight OK (cores=$CORE_AVAIL mem=$MEM_AVAIL)"
              break
            fi
            log "  preflight#${attempt}: quota NAO ok (cores=${CORE_AVAIL:-?} mem=${MEM_AVAIL:-?}), raw cores: $(echo "$CORE_RAW"|tr -d '\n'|head -c 400)"
            [ "${attempt}" -lt 5 ] && { log "  quota travada (ghost), aguardando 120s..."; sleep 120; }
          done

          if [ "$CORES_OK" != "true" ]; then
            log "quota travada apos 5 tentativas - ABORTANDO rodada"
            log "--- RESUMO PREFLIGHT ---"; echo -e "$PRELOG" >> "$LOG"; cat "$LOG"
            exit 0
          fi

          log "SSH pub key: $(echo "$SSHKEY" | ssh-keygen -lf - 2>&1 | head -1)"

          # Launch com retry - logging VERBOSO de cada tentativa
          BASED2=""
          for i in $(seq 1 8); do
            log "=== tentativa $i/8 ==="
            START=$(date +%s)
            OUT=$(oci compute instance launch --compartment-id "$ROOT" --availability-domain "$AD" \
              --shape VM.Standard.A1.Flex --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --display-name "based" --private-ip 10.0.0.144 \
              --source-details "{\"sourceType\":\"image\",\"imageId\":\"$IMAGE\"}" \
              --subnet-id "$SUBNET" --ssh-authorized-keys-file /tmp/key.pub \
              --metadata "{\"user_data\":\"$FIX\"}" \
              --query 'data.id' --raw-output 2>&1)
            RC=$?
            ELAPSED=$(( $(date +%s) - START ))
            REQID=$(echo "$OUT" | grep -oP '"opc-request-id": "\K[^"]+' | head -1)
            if [ $RC -eq 0 ] && [ -n "$OUT" ]; then
              BASED2="$OUT"
              log "SUCESSO na tentativa $i: instance=$BASED2 (${ELAPSED}s)"
              break
            fi
            CODE=$(echo "$OUT" | grep -oP '"code": "\K[^"]+' | head -1)
            MSG=$(echo "$OUT" | grep -oP '"message": "\K[^"]+' | head -1)
            log "  FALHOU rc=$RC (${ELAPSED}s) code='${CODE:-?}' msg='${MSG:-?}' reqid='${REQID:-?}'"
            log "  OUTPUT COMPLETO: $(echo "$OUT" | tr '\n' ' ' | head -c 2000)"
            if [ "$CODE" = "LimitExceeded" ]; then
              log "  => ghost quota, aguardando 180s..."
              sleep 180
            elif [ "$CODE" = "InternalError" ] || echo "$MSG" | grep -qi "capacity"; then
              log "  => out of host capacity, aguardando 90s..."
              sleep 90
            else
              log "  => erro generico, aguardando 90s..."
              sleep 90
            fi
          done

          if [ -z "$BASED2" ]; then
            log "=== SEM CAPACIDADE NESTA RODADA (8 tentativas) ==="
            echo "--- LOG COMPLETO ---"; cat "$LOG"
            exit 0
          fi

          # Aguardar instancia ficar RUNNING
          log "Aguardando instancia $BASED2 ficar RUNNING..."
          RUNNING=false
          for w in $(seq 1 20); do
            STATE_RAW=$(oci compute instance get --instance-id "$BASED2" --query 'data."lifecycle-state"' --raw-output 2>&1)
            log "  [$w] state: $STATE_RAW"
            if [ "$STATE_RAW" = "RUNNING" ]; then RUNNING=true; break; fi
            sleep 15
          done
          if [ "$RUNNING" != "true" ]; then log "AVISO: nao confirmou RUNNING em 300s"; fi

          # NOTA: nao anexar o IP reservado 'based-ip' (129.148.26.109) pois ele
          # agora pertence a MAQUINA MICRO (que deve continuar com esse IP fixo).
          # A based usa um IP publico EPHEMERAL (padrao do VCN). Se um dia
          # quisermos IP fixo para a based, criar OUTRO IP reservado novo.
          sleep 60
          log "NOTA: based com IP efemero (129.148.26.109 fica na micro)."
          log "Obtendo IP publico efemero da based..."
          VNIC_PUB=$(oci compute vnic-attachment list --compartment-id "$ROOT" --instance-id "$BASED2" --query 'data[0]."vnic-id"' --raw-output 2>&1)
          log "  vnic: $VNIC_PUB"
          PUB_IP=$(oci network private-ip list --vnic-id "$VNIC_PUB" --query 'data[0]."public-ip"' --raw-output 2>&1)
          log "  IP publico efemero da based: ${PUB_IP:-N/D}"
          log "Anexando hd-externo (100 GB)..."
          ATTACH=$(oci compute volume-attachment attach --instance-id "$BASED2" --volume-id "$HD" --type paravirtualized --wait-for-state ATTACHED --query 'data."lifecycle-state"' --raw-output 2>&1)
          log "  volume attachment: $ATTACH"
          log "IP e volume configurados - MAQUINA PRONTA"
          echo "--- LOG COMPLETO ---"; cat "$LOG"
          curl -s --max-time 10 -o /dev/null -X POST -H "Content-Type: application/json" -d '{"content":"based bootou — Ubuntu ARM fresh + fix.sh + hd-externo 100GB anexado (IP efemero)"}' "$WH"
